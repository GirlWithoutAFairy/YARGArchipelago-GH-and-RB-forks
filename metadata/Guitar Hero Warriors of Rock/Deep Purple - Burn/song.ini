loading_phrase = Like the rest of the album, "Burn" was recorded at Montreaux, Switzerland, in November 1973. Although Coverdale wrote the lyrics, they could just as easily have been penned by Blackmore, whose fascination with the Middle Ages, witchcraft and the supernatural is reflected in this tale of a bewitching female. The song became a regular with the band for the next two years.
